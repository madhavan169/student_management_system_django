{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>
    <link rel="stylesheet" href="{% staic 'myapp/update.css' %}"
</head>
<body>

    <h2>Update Student Details</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" value="{{ st.name }}" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ st.email }}" required>
        <br><br>

        <label>Department:</label>
        <input type="text" name="department" value="{{ st.department }}" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" value="{{ st.age }}" required>
        <br><br>

        <label>Marks:</label>
        <input type="number" name="marks" value="{{ st.marks }}" required>
        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{% url 'view' %}">Back to Student List</a>

</body>
</html>
