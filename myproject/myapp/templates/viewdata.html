{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Details</title>
<link rel="stylesheet" href="{% static 'myapp/view.css' %}">

</head>
<body>

    <h2>All Student Details</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Age</th>
            <th>Marks</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        {% for i in students %}

        <tr>
            <td>{{ i.id }}</td>
            <td>{{ i.name }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.department }}</td>
            <td>{{ i.age }}</td>
            <td>{{ i.marks }}</td>
            <td><a href="{% url 'updatename' i.id %}">Ubdate students</a></td>
            <td><a href="{% url 'delete' i.id %}">delete</a></td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="6">No students found.</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="{% url 'add' %}">Add New Student</a>

</body>
</html>
